name: Build and test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore JevDotNet.slnx

      - name: Build
        run: dotnet build JevDotNet.slnx --configuration Release --no-restore

      - name: Run SDK tests
        run: dotnet test --project JevDotNet.Tests/JevDotNet.Tests.csproj --configuration Release --no-build

      - name: Run demo tests
        run: dotnet test --project JevDotNet.Demo.Tests/JevDotNet.Demo.Tests.csproj --configuration Release --no-build

      - name: Pack and consume the packages
        run: ./eng/verify-packages.sh --no-build
